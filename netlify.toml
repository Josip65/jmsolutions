[build]
  publish = "."

# Besplatna kontakt forma — Netlify automatski hvata POST na /contact.html
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Lijepi URL-ovi (bez .html)
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 301
[[redirects]]
  from = "/kontakt"
  to = "/contact.html"
  status = 301
